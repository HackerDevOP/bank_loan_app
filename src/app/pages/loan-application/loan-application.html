<div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
  <div class="mb-8">
    <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-slate-900">
      Loan Application Form
    </h1>
    <p class="text-sm text-slate-500 mt-1">
      Fill out the applicant details and existing loan obligations.
    </p>
  </div>

  <form id="loanAppForm" (submit)="$event.preventDefault(); onSubmit()" class="space-y-8">
    <input type="hidden" id="applicantID" value="0" />
    <input type="hidden" id="customerId" value="0" />
    <input type="hidden" id="applicationStatus" value="Pending" />
    <input type="hidden" id="dateApplied" />

    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 sm:p-8">
      <h2
        class="text-base font-bold text-slate-900 border-b border-slate-200 pb-3 mb-6 flex items-center gap-2"
      >
        <span
          class="w-6 h-6 rounded-full bg-emerald-100 text-emerald-700 text-xs flex items-center justify-center font-semibold"
          >1</span
        >
        Personal Information
      </h2>

      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
        <div class="sm:col-span-2">
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1"
            >Full Name </label
          >
          <input
            [formField]="applicationForm.fullName"
            type="text"
            id="fullName"
            placeholder="Jane Doe"
            class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm focus:border-emerald-500 focus:outline-none focus:ring-1 focus:ring-emerald-500"
          />
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1"
            >PAN Card</label
          >
          <input
            [formField]="applicationForm.panCard"
            type="text"
            id="panCard"
            placeholder="ABCDE1234F"
            class="w-full uppercase rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm focus:border-emerald-500 focus:outline-none focus:ring-1 focus:ring-emerald-500"
          />
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1"
            >Date of Birth</label
          >
          <input
            [formField]="applicationForm.dateOfBirth"
            type="date"
            id="dateOfBirth"
            class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm focus:border-emerald-500 focus:outline-none focus:ring-1 focus:ring-emerald-500"
          />
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1"
            >Email</label
          >
          <input
            [formField]="applicationForm.email"
            type="email"
            id="email"
            placeholder="jane@example.com"
            class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm focus:border-emerald-500 focus:outline-none focus:ring-1 focus:ring-emerald-500"
          />
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1"
            >Phone Number</label
          >
          <input
            [formField]="applicationForm.phone"
            type="tel"
            id="phone"
            placeholder="+91 9876543210"
            class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm focus:border-emerald-500 focus:outline-none focus:ring-1 focus:ring-emerald-500"
          />
        </div>
      </div>
    </div>

    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 sm:p-8">
      <h2
        class="text-base font-bold text-slate-900 border-b border-slate-200 pb-3 mb-6 flex items-center gap-2"
      >
        <span
          class="w-6 h-6 rounded-full bg-emerald-100 text-emerald-700 text-xs flex items-center justify-center font-semibold"
          >2</span
        >
        Residential Address
      </h2>

      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
        <div class="sm:col-span-2 lg:col-span-4">
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1"
            >Street Address</label
          >
          <input
            [formField]="applicationForm.address"
            type="text"
            id="address"
            placeholder="Flat 402, Green Valley Apartments"
            class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm focus:border-emerald-500 focus:outline-none focus:ring-1 focus:ring-emerald-500"
          />
        </div>

        <div class="lg:col-span-2">
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1"
            >City</label
          >
          <input
            [formField]="applicationForm.city"
            type="text"
            id="city"
            placeholder="Pune"
            class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm focus:border-emerald-500 focus:outline-none focus:ring-1 focus:ring-emerald-500"
          />
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1"
            >State</label
          >
          <input
            [formField]="applicationForm.state"
            type="text"
            id="state"
            placeholder="Maharashtra"
            class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm focus:border-emerald-500 focus:outline-none focus:ring-1 focus:ring-emerald-500"
          />
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1"
            >Zip / Postal Code</label
          >
          <input
            [formField]="applicationForm.zipCode"
            type="text"
            id="zipCode"
            placeholder="411001"
            class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm focus:border-emerald-500 focus:outline-none focus:ring-1 focus:ring-emerald-500"
          />
        </div>
      </div>
    </div>

    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 sm:p-8">
      <h2
        class="text-base font-bold text-slate-900 border-b border-slate-200 pb-3 mb-6 flex items-center gap-2"
      >
        <span
          class="w-6 h-6 rounded-full bg-emerald-100 text-emerald-700 text-xs flex items-center justify-center font-semibold"
          >3</span
        >
        Financial Background
      </h2>

      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1"
            >Annual Income ($)</label
          >
          <input
            [formField]="applicationForm.annualIncome"
            type="number"
            id="annualIncome"
            placeholder="75000"
            class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm focus:border-emerald-500 focus:outline-none focus:ring-1 focus:ring-emerald-500"
          />
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1"
            >Employment Status</label
          >
          <select
            [formField]="applicationForm.employmentStatus"
            id="employmentStatus"
            class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm focus:border-emerald-500 focus:outline-none focus:ring-1 focus:ring-emerald-500 bg-white"
          >
            <option value="Salaried">Salaried</option>
            <option value="Self-Employed">Self-Employed</option>
            <option value="Business Owner">Business Owner</option>
            <option value="Retired">Retired</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1"
            >Credit Score</label
          >
          <input
            [formField]="applicationForm.creditScore"
            type="number"
            id="creditScore"
            placeholder="750"
            class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm focus:border-emerald-500 focus:outline-none focus:ring-1 focus:ring-emerald-500"
          />
        </div>

        <div class="sm:col-span-2 lg:col-span-3">
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1"
            >Assets Owned</label
          >
          <input
            [formField]="applicationForm.assets"
            type="text"
            id="assets"
            placeholder="e.g. Residential Property, Fixed Deposits, Stocks"
            class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm focus:border-emerald-500 focus:outline-none focus:ring-1 focus:ring-emerald-500"
          />
        </div>
      </div>
    </div>

    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 sm:p-8">
      <div class="flex items-center justify-between border-b border-slate-200 pb-3 mb-6">
        <h2 class="text-base font-bold text-slate-900 flex items-center gap-2">
          <span
            class="w-6 h-6 rounded-full bg-emerald-100 text-emerald-700 text-xs flex items-center justify-center font-semibold"
            >4</span
          >
          Existing Loans & Liabilities
        </h2>
        <button
          (click)="addLoan()"
          type="button"
          class="text-xs font-semibold text-emerald-600 hover:text-emerald-700 transition"
        >
          + Add Loan
        </button>
      </div>

      <div id="loansList" class="space-y-4">
        @for (loan of applicationForm.Loans; track $index) {
          <div
            class="loan-row grid grid-cols-1 sm:grid-cols-12 gap-3 items-end p-4 rounded-xl border border-slate-100 bg-slate-50"
          >
            <input type="hidden" class="loan-id" />
            <input type="hidden" class="loan-applicant-id" value="0" />

            <div class="sm:col-span-5">
              <label
                class="block text-[11px] font-semibold uppercase tracking-wider text-slate-600 mb-1"
                >Bank / Institution</label
              >
              <input
                [formField]="loan.bankName"
                type="text"
                class="loan-bank-name w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-emerald-500 focus:outline-none bg-white"
                placeholder="HDFC Bank"
              />
            </div>

            <div class="sm:col-span-3">
              <label
                class="block text-[11px] font-semibold uppercase tracking-wider text-slate-600 mb-1"
                >Loan Amount ($)</label
              >
              <input
                [formField]="loan.loanAmount"
                type="number"
                class="loan-amount w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-emerald-500 focus:outline-none bg-white"
                placeholder="10000"
              />
            </div>

            <div class="sm:col-span-3">
              <label
                class="block text-[11px] font-semibold uppercase tracking-wider text-slate-600 mb-1"
                >Monthly EMI ($)</label
              >
              <input
                [formField]="loan.emi"
                type="number"
                class="loan-emi w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-emerald-500 focus:outline-none bg-white"
                placeholder="450"
              />
            </div>

            @if (applicationForm.Loans.length > 1) {
              <div class="sm:col-span-1 flex justify-end">
                <button
                  (click)="removeLoan($index)"
                  type="button"
                  class="p-2 text-slate-400 hover:text-rose-600 transition"
                  title="Delete"
                >
                  ✕
                </button>
              </div>
            }
          </div>
        }
      </div>
    </div>

    <div class="flex items-center justify-end gap-4 pt-2">
      <button
        (click)="applicationForm().reset()"
        type="button"
        class="px-6 py-2.5 rounded-lg border border-slate-300 text-sm font-medium text-slate-700 hover:bg-slate-100 transition"
      >
        Cancel
      </button>
      <button
        (click)="onSubmit()"
        type="button"
        class="px-6 py-2.5 rounded-lg bg-emerald-600 text-sm font-semibold text-white shadow-sm hover:bg-emerald-500 transition"
      >
        Submit Application
      </button>
    </div>
  </form>
</div>
